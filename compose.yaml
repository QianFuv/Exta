services:
  exta:
    image: ${EXTA_IMAGE:?Set the verified image tag or digest}
    platform: linux/amd64
    user: "${EXTA_UID:?Set the state owner's UID}:${EXTA_GID:?Set the state owner's GID}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [proxy]
    volumes:
      - type: bind
        source: ./exta-data
        target: /var/lib/exta
        bind:
          create_host_path: false
    stop_grace_period: 45s
    restart: unless-stopped
networks:
  proxy:
    external: true
    name: ${EXTA_PROXY_NETWORK:?Use the dedicated bridge shared only with the reverse proxy}

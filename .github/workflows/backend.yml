name: Reusable Go Checks

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ""
      ui_artifact_id:
        required: true
        type: string
      ui_sha256:
        required: true
        type: string
    outputs:
      candidate_artifact_id:
        description: Immutable candidates accepted by both platform lanes
        value: ${{ jobs.linux.outputs.candidate_artifact_id }}

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly -p=2
  GOMAXPROCS: "2"

jobs:
  complete:
    name: Complete platform acceptance
    needs: [linux, windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout gate source
        id: checkout_source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require both accepted platforms
        id: require_platforms
        env:
          CI_GATE_RESULTS: '{"linux":"${{ needs.linux.result }}","windows":"${{ needs.windows.result }}"}'
        run: python -B tools/release/report.py gate

  linux:
    name: Linux quality and acceptance
    outputs:
      windows_artifact_id: ${{ steps.export_windows.outputs.artifact-id }}
      candidate_artifact_id: ${{ steps.export_candidates.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        id: checkout_source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Go
        id: set_up_go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.10
          cache: true
          cache-dependency-path: go.sum
      - name: Set up Node.js
        id: set_up_node_js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned npm
        id: install_pinned_npm
        run: npm install --global npm@12.2.0
      - name: Install locked frontend dependencies
        id: install_locked_frontend_dependencies
        run: npm ci --prefix web
      - name: Download exact tested UI
        id: download_exact_tested_ui
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ inputs.ui_artifact_id }}
          path: artifacts/frontend
          merge-multiple: true
      - name: Verify and reuse tested UI bytes
        id: verify_and_reuse_tested_ui_bytes
        env:
          UI_SHA256: ${{ inputs.ui_sha256 }}
        run: |
          printf '%s  %s\n' "$UI_SHA256" artifacts/frontend/production.zip | sha256sum --check
          cp artifacts/frontend/production.zip internal/webassets/production.zip
      - name: Go verification with Linux race detector
        id: go_verification_with_linux_race_detector
        env:
          CGO_ENABLED: "1"
        run: |
          go vet ./cmd/... ./internal/... ./tests/... ./tools/...
          go test -race ./cmd/... ./internal/... ./tests/... ./tools/... -count=1 -timeout=10m
      - name: Report quality summary
        id: report_quality
        if: always()
        env:
          CI_STAGE: quality
          CI_PLATFORMS: linux/amd64
          CI_STATUS: ${{ job.status }}
          CI_CHECKS: ${{ toJSON(steps) }}
        run: python -B tools/release/report.py summary
      - name: Build the two standalone targets
        id: build_the_two_standalone_targets
        run: |
          mkdir -p artifacts
          go run ./tools/release verify --output artifacts/candidate --version "${CANDIDATE_VERSION:-ci-$GITHUB_SHA}"
          cp internal/webassets/production.zip artifacts/candidate/production.zip
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
      - name: Native Linux acceptance
        id: native_linux_acceptance
        env:
          EXTA_SMOKE_BINARY: ${{ github.workspace }}/artifacts/candidate/exta-linux-amd64
        run: go test ./tools/release -run '^TestPackagedRuntime$' -v -count=1 -timeout=150s
      - name: Install Chromium on the disposable runner
        id: install_chromium_on_the_disposable_runner
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Production browser acceptance
        id: production_browser_acceptance
        env:
          EXTA_E2E_BINARY: ${{ github.workspace }}/artifacts/candidate/exta-linux-amd64
        run: npm run test:e2e --prefix web
      - name: Build and accept Linux amd64 container
        id: build_and_accept_linux_amd64_container
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          docker build --platform linux/amd64 -f Dockerfile --build-arg SOURCE_SHA="$GITHUB_SHA" --build-arg VERSION="${CANDIDATE_VERSION:-ci-$GITHUB_SHA}" -t "exta-candidate:$GITHUB_SHA" artifacts/candidate
          bash tools/release/container-smoke.sh artifacts/candidate "exta-candidate:$GITHUB_SHA" artifacts/container-evidence
          docker save "exta-candidate:$GITHUB_SHA" -o artifacts/candidate/container-linux-amd64.tar
          (cd artifacts/candidate && sha256sum container-linux-amd64.tar > container-SHA256SUMS)
          cp -R artifacts/container-evidence artifacts/candidate/container-evidence
      - name: Record candidate artifact provenance
        id: record_candidate_artifact_provenance
        if: always()
        env:
          CI_STAGE: build-acceptance
          CI_PLATFORMS: linux/amd64,windows/amd64
          CI_STATUS: ${{ job.status }}
          CI_CHECKS: ${{ toJSON(steps) }}
          CI_REPORT_ROOT: artifacts/candidate
        run: python -B tools/release/report.py manifest .
      - name: Export exact Windows candidate
        id: export_windows
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-windows-amd64-${{ github.sha }}
          path: |
            artifacts/candidate/exta-windows-amd64.exe
            artifacts/candidate/*_windows_amd64.zip
            artifacts/candidate/release-manifest.json
            artifacts/candidate/production.zip
          if-no-files-found: error
          retention-days: 7
      - name: Export accepted candidates and image
        id: export_candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-linux-amd64-${{ github.sha }}
          path: artifacts/candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Upload browser diagnostics
        id: upload_browser_diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: browser-linux-amd64-${{ github.sha }}
          path: |
            web/test-results/
            artifacts/candidate/ci-manifest.json
          retention-days: 7

      - name: Report build-acceptance summary
        id: report_build_acceptance_summary
        if: always()
        env:
          CI_STAGE: build-acceptance
          CI_PLATFORMS: linux/amd64,windows/amd64
          CI_STATUS: ${{ job.status }}
          CI_CHECKS: ${{ toJSON(steps) }}
          CI_REPORT_ROOT: artifacts/candidate
        run: python -B tools/release/report.py summary

  windows:
    name: Windows acceptance
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        id: checkout_source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Go
        id: set_up_go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.10
          cache: true
          cache-dependency-path: go.sum
      - name: Set up Node.js
        id: set_up_node_js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Download exact Windows candidate
        id: download_exact_windows_candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.linux.outputs.windows_artifact_id }}
          merge-multiple: true
          path: artifacts/candidate
      - name: Verify exact Windows candidate and reuse embedded UI
        id: verify_exact_windows_candidate_and_reuse_embedded_ui
        shell: pwsh
        env:
          UI_SHA256: ${{ inputs.ui_sha256 }}
        run: |
          $manifest = Get-Content artifacts/candidate/release-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.head -ne $env:GITHUB_SHA) { throw 'Candidate source mismatch' }
          $artifact = $manifest.artifacts | Where-Object target -eq 'windows/amd64'
          if (@($artifact).Count -ne 1) { throw 'Missing unique Windows candidate' }
          $actual = (Get-FileHash artifacts/candidate/exta-windows-amd64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $artifact.sha256) { throw 'Windows candidate checksum mismatch' }
          $bundle = (Get-FileHash artifacts/candidate/production.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($bundle -ne $manifest.source_files.'internal/webassets/production.zip' -or $bundle -ne $env:UI_SHA256) { throw 'Embedded archive checksum mismatch' }
          Copy-Item artifacts/candidate/production.zip internal/webassets/production.zip
      - name: Windows Go and native acceptance
        id: windows_go_and_native_acceptance
        shell: pwsh
        run: |
          go test ./cmd/... ./internal/... ./tests/... ./tools/... -count=1 -timeout=10m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:EXTA_SMOKE_BINARY = Join-Path $pwd 'artifacts/candidate/exta-windows-amd64.exe'
          go test ./tools/release -run '^TestPackagedRuntime$' -v -count=1 -timeout=150s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned npm
        id: install_pinned_npm
        run: npm install --global npm@12.2.0
      - name: Install locked frontend dependencies
        id: install_locked_frontend_dependencies
        run: npm ci --prefix web
      - name: Install Chromium on the disposable runner
        id: install_chromium_on_the_disposable_runner
        working-directory: web
        run: npx playwright install chromium
      - name: Production browser acceptance
        id: production_browser_acceptance
        shell: pwsh
        run: |
          $env:EXTA_E2E_BINARY = Join-Path $pwd 'artifacts/candidate/exta-windows-amd64.exe'
          npm run test:e2e --prefix web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload browser diagnostics
        id: upload_browser_diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: browser-windows-amd64-${{ github.sha }}
          path: web/test-results/
          retention-days: 7
      - name: Record Windows artifact provenance
        id: record_windows_artifact_provenance
        if: always()
        env:
          CI_STAGE: build-acceptance
          CI_PLATFORMS: windows/amd64
          CI_STATUS: ${{ job.status }}
          CI_CHECKS: ${{ toJSON(steps) }}
          CI_REPORT_ROOT: artifacts/candidate
        run: python -B tools/release/report.py manifest exta-windows-amd64.exe release-manifest.json production.zip
      - name: Upload Windows acceptance evidence
        id: upload_windows_acceptance_evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: acceptance-windows-amd64-${{ github.sha }}
          path: artifacts/candidate/ci-manifest.json
          if-no-files-found: warn
          retention-days: 14
      - name: Report build-acceptance summary
        id: report_build_acceptance_summary
        if: always()
        env:
          CI_STAGE: build-acceptance
          CI_PLATFORMS: windows/amd64
          CI_STATUS: ${{ job.status }}
          CI_CHECKS: ${{ toJSON(steps) }}
          CI_REPORT_ROOT: artifacts/candidate
        run: python -B tools/release/report.py summary

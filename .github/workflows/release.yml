name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-v0.1.2
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'QianFuv/Exta' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/verify.yml
    with:
      version: 0.1.2
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: candidate-linux-amd64-${{ github.sha }}
          path: candidate
      - name: Check accepted artifact identities
        working-directory: candidate
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$(jq -r .head release-manifest.json)" = "$SOURCE_SHA"
          test "$(jq -r .version release-manifest.json)" = 0.1.2
          test "$(jq -r '.artifacts | map(.target) | sort | join(",")' release-manifest.json)" = linux/amd64,windows/amd64
          sha256sum --check SHA256SUMS
          sha256sum --check container-SHA256SUMS
          docker load --input container-linux-amd64.tar
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "exta-candidate:$SOURCE_SHA")" = "$SOURCE_SHA"
      - name: Publish accepted container and GitHub release
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          GH_REPO: QianFuv/Exta
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          python ../tools/release/publish.py .
          digest="$(cat container-digest.txt)"
          printf '## Exta release\n\nSource: `%s`\n\nContainer: `%s`\n\n[GitHub v0.1.2](https://github.com/QianFuv/Exta/releases/tag/v0.1.2)\n' "$SOURCE_SHA" "$digest" >> "$GITHUB_STEP_SUMMARY"
